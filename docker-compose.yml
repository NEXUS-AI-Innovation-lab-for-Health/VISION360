# =============================================================================
# Docker Compose - Vision360
# =============================================================================
# Configuration pour déployer l'ensemble de l'écosystème Vision360 :
# - Backend FastAPI (API REST + intégration Gemini/Groq)
# - Frontend Next.js (interface web)
#
# Utilisation :
#   docker compose up --build        # Build et lancement
#   docker compose up -d             # Lancement en arrière-plan
#   docker compose logs -f           # Voir les logs
#   docker compose down              # Arrêter les services
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Base de données PostgreSQL
  # ---------------------------------------------------------------------------
  # Stockage persistant pour :
  # - Utilisateurs et profils PMR
  # - Allergies et conditions médicales
  # - Préférences évolutives (aime/n'aime pas)
  # - Historique des interactions avec l'IA
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine       # Image officielle PostgreSQL légère
    container_name: vision360_db
    ports:
      - "5432:5432"                 # Port PostgreSQL standard
    environment:
      POSTGRES_USER: postgres       # Utilisateur par défaut
      POSTGRES_PASSWORD: postgres   # Mot de passe (changer en production!)
      POSTGRES_DB: vision360        # Nom de la base de données
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistance des données
      # Script de création de la base, joué automatiquement par PostgreSQL
      # au TOUT PREMIER démarrage (quand le volume est encore vide).
      # Monté en lecture seule : le conteneur ne peut pas altérer le dépôt.
      # Pour le rejouer : docker compose down -v && docker compose up -d
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend API - FastAPI Python
  # ---------------------------------------------------------------------------
  # Service principal exposant l'API REST pour :
  # - Analyse d'images via Gemini (/api/describe/gemini)
  # - Recommandations via Groq (/api/describe/groq)
  # - Enrichissement détections (/api/guidance/*)
  # - Gestion utilisateurs et préférences (/api/users/*)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .                    # Contexte = racine du projet
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"                 # Port exposé pour l'API
    env_file:
      - .env                        # Charger les variables depuis .env
    environment:
      - PYTHONUNBUFFERED=1          # Logs en temps réel
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/vision360
    depends_on:
      postgres:
        condition: service_healthy  # Attendre que PostgreSQL soit prêt
    restart: unless-stopped         # Redémarrage auto sauf arrêt manuel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Frontend Web - Next.js React
  # ---------------------------------------------------------------------------
  # Application web pour :
  # - Configuration du profil utilisateur
  # - Capture webcam et analyse
  # - Affichage des recommandations
  # ---------------------------------------------------------------------------
  web_next:
    build:
      context: ./web_next
      dockerfile: Dockerfile
      args:
        # IMPORTANT : dans Next.js, une variable NEXT_PUBLIC_* est figée
        # DANS LE BUNDLE au moment du BUILD, pas lue à l'exécution.
        # Elle doit donc être passée ici en build arg : la définir uniquement
        # dans "environment" ci-dessous serait sans effet côté navigateur,
        # et l'application retomberait sur l'URL Cloud Run codée en dur
        # dans src/app/page.tsx (qui n'existe plus).
        NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api}"
    ports:
      - "3000:3000"                 # Port exposé pour le frontend
    environment:
      # Conservée pour le rendu côté serveur de Next.js
      NEXT_PUBLIC_API_BASE: "${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api}"
    depends_on:
      backend:
        condition: service_healthy  # Attendre que le backend soit prêt
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Volumes persistants
# -----------------------------------------------------------------------------
volumes:
  postgres_data:                    # Données PostgreSQL persistantes
